version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    # `numpy<2` in the `onnx` extra is deliberate (pyproject.toml explains it at the requirement):
    # the marker names macOS/Intel, where torch tops out at 2.2.2 -- below 2.3, the first release
    # built against NumPy 2 -- so a major numpy update there raises "Numpy is not available" on the
    # tensor conversion `predict()` ends with. Dependabot read the cap as stale and proposed
    # `<2` -> `<3` (PR #2, declined); this stops it proposing that again.
    #
    # Both keys, because they match different things: `update-types` classifies the PR as a major
    # update, and `versions` matches the version the change would admit. Patch and minor numpy
    # updates still come through -- the cap is about one major version, not about numpy updates.
    ignore:
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
        versions: [">=2"]

  - package-ecosystem: npm
    directory: "/laya-ts"
    schedule:
      interval: weekly
    labels: [dependencies]

  - package-ecosystem: npm
    directory: "/sdk/typescript"
    schedule:
      interval: weekly
    labels: [dependencies]

  # Actions are the other half of the supply chain: a compromised action runs with the
  # workflow's token. Keep them current, and prefer pinning to a SHA for third-party ones.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    # github/codeql-action is one repository publishing several actions, and CodeQL refuses to
    # run when init, autobuild and analyze are not all the same version: "Loaded a configuration
    # file for version X, but running version Y". Ungrouped, Dependabot opens one PR per action,
    # so every one of them is a mismatched pair that cannot go green alone and cannot be merged
    # alone. #1353 bumped init and #1356 bumped analyze, both red, and autobuild got no PR at
    # all, which left the lane broken even after merging that pair. Grouping them means one PR
    # that moves all three together.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
