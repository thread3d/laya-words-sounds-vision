name: Rust

# Python is the product; Rust follows it. Report parity drift without blocking
# Python improvements, weekly and on demand. Always regenerate fixtures from this
# checkout, never cache goldens or quietly pass model-backed tests with missing artifacts.
on:
  # Weekly report, and on demand. Every job in this lane is advisory (`continue-on-error`), so
  # nothing it reports can block a pull request or a release, while each matrix cell re-records its
  # fixtures from the Python package. See docs/ci.md.
  schedule:
    - cron: "0 4 * * 1"       # Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.event_name }}-${{ github.ref }}
  # Supersede, don't queue: a burst of pushes otherwise bills every commit's matrix (see ci.yml).
  cancel-in-progress: true

env:
  USE_TF: "0"
  USE_TORCH: "1"
  TOKENIZERS_PARALLELISM: "false"
  CARGO_BUILD_JOBS: "4"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"

jobs:
  # One job records what every cell compares against. Before this each of the four cells installed
  # torch, fetched checkpoints and re-recorded its own: `routing` was recorded four times, english
  # and multilingual twice each (the router cell selects both), and only typed-decisions once.
  # Nine recording passes for four recordings. See docs/ci.md ("Record once, fan out").
  goldens:
    name: goldens (recorded once for every cell)
    runs-on: ${{ fromJSON(vars.LAYA_RUNNER || '["ubuntu-latest"]') }}
    # Recording all four sets is the long pole: the cells ran 40-100 minutes INCLUDING their test
    # run, and this job trades their parallel exports for one serial pass. Generous on purpose --
    # one job timing out fails the lane, where a slow cell only fails itself.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: laya-rust/tools/requirements-regen.txt
      - name: Install regeneration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.14.0" --index-url https://download.pytorch.org/whl/cpu
          pip install -r laya-rust/tools/requirements-regen.txt

      # The same ONNX keys the parity cells restore, so a cold cache is warmed HERE and the cells
      # read it: they declare `needs: goldens`, and a cache entry is saved before a job reports
      # complete.
      - name: Cache exported english artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            onnx/english
            onnx-split/english
          key: laya-rust-onnx-${{ runner.os }}-english-${{ hashFiles('laya-rust/tools/regen_golden.py', 'laya-dotnet/tools/export_onnx.py', 'laya-ts/scripts/export_onnx.py', 'laya-rust/tools/requirements-regen.txt', 'laya/common.py') }}
      - name: Cache exported multilingual artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            onnx/multilingual
            onnx-split/multilingual
          key: laya-rust-onnx-${{ runner.os }}-multilingual-${{ hashFiles('laya-rust/tools/regen_golden.py', 'laya-dotnet/tools/export_onnx.py', 'laya-ts/scripts/export_onnx.py', 'laya-rust/tools/requirements-regen.txt', 'laya/common.py') }}
      - name: Cache exported typed-decisions artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            onnx/typed-decisions
            onnx-split/typed-decisions
          key: laya-rust-onnx-${{ runner.os }}-typed-decisions-${{ hashFiles('laya-rust/tools/regen_golden.py', 'laya-dotnet/tools/export_onnx.py', 'laya-ts/scripts/export_onnx.py', 'laya-rust/tools/requirements-regen.txt', 'laya/common.py') }}
      - name: Cache pinned Hugging Face downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: laya-rust-hf-${{ runner.os }}-goldens-${{ hashFiles('laya-rust/tools/regen_golden.py', 'laya-dotnet/tools/export_onnx.py', 'laya-ts/scripts/export_onnx.py') }}

      - name: Export the checkpoints and record every golden from Python at this commit
        env:
          # Scoped to this step: only the step that fetches from the hub gets the credential.
          # Unset expands to "", which the implicit token path treats as anonymous.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python laya-rust/tools/regen_golden.py --checkpoint all

      # The recorder's floor. A directory the recorder never wrote reaches a cell as `skip:`, and
      # `check_test_skips.py` is what turns that red -- but only after a 20-minute cargo build.
      - name: The recorded set is complete
        run: |
          for c in routing english multilingual typed-decisions; do
            test -d "laya-rust/tests/golden/$c" \
              || { echo "::error::the recorder did not write laya-rust/tests/golden/$c"; exit 1; }
            test -n "$(find "laya-rust/tests/golden/$c" -type f -name '*.json' -print -quit)" \
              || { echo "::error::laya-rust/tests/golden/$c holds no JSON"; exit 1; }
          done

      # One day: an input to this run's cells, not an archive. Artifact storage is billed the way
      # minutes are.
      - name: Publish the goldens
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-goldens
          path: laya-rust/tests/golden
          retention-days: 1

  parity:
    name: parity (${{ matrix.name }})
    runs-on: ${{ fromJSON(vars.LAYA_RUNNER || '["ubuntu-latest"]') }}
    # The goldens arrive recorded; what stays per cell is the checkpoint this cell selects, the
    # ONNX artifacts it loads and the Rust tests themselves.
    needs: goldens
    continue-on-error: true
    # Sharded per checkpoint. The replays are serial only because each one loads models, and that
    # constraint is per checkpoint rather than across them, so one job per checkpoint runs in
    # parallel and each has its own budget instead of one pot that the next parity PR spends.
    #
    # The limits come from the slow-host estimates in the runtime investigation, with headroom:
    # english about 61 min, typed-decisions about 69, multilingual about 21, and the router cell
    # (two engines, a handful of requests) well under that. The same job has run in about 25 and
    # about 47 minutes depending on the host it landed on, so each limit is roughly 1.4x the
    # slow-host figure. A limit that is hit is recorded by GitHub as CANCELLED, which reads like
    # a superseded run rather than a budget failure, so these should not be tight.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # Two at a time. This used to be about the hub -- every cell fetched weights from the same
      # repo, and unauthenticated fetches throttled under load -- and that pressure moved to the
      # `goldens` job. It stays at two because the cells are CPU-bound inference runs on shared
      # runners, where four at once was measured slower per cell than two.
      max-parallel: 2
      matrix:
        include:
          # --workspace: the model-free tests run in every checkpoint cell (seconds), so each
          # floor is that count plus the cell's own model-backed tests.
          - name: english
            checkpoints: english
            test-args: --workspace
            timeout: 90
            min-passed: 350
          - name: multilingual
            checkpoints: multilingual
            test-args: --workspace
            timeout: 40
            min-passed: 350
          - name: typed-decisions
            checkpoints: typed-decisions
            test-args: --workspace
            timeout: 100
            min-passed: 350
          # The router end-to-end tests load english and multilingual side by side, so they run
          # only in a cell that selects both. Only that test binary runs here: the checkpoint
          # cells above own everything else.
          - name: router
            checkpoints: english multilingual
            test-args: --test router_end_to_end_tests
            # 60, not 30. This cell selects two checkpoints, so on a cold export cache it pays for
            # both before a single test runs, and 30 minutes does not cover that: the first run of
            # this matrix was CANCELLED 29m22s into the export step. Measured cold on that run,
            # from the sibling cells that did finish their exports: english 23m58s and
            # multilingual 8m50s, so about 33 minutes of export alone, plus about a minute of
            # dependency install. The cells above fill the per-checkpoint caches this cell reads,
            # but a cache is only saved by a job that succeeds, and the key includes laya/common.py,
            # so a cold path recurs on any change to the model definition rather than just once.
            # The tests themselves are a handful of requests over two engines.
            timeout: 60
            min-passed: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: laya-rust/tools/requirements-regen.txt
      - name: Install regeneration dependencies
        run: |
          python -m pip install --upgrade pip
          # No torch and no hub token: this cell records nothing. requirements-regen.txt is still
          # installed because test_ci_tools.py and check_test_skips.py import the pinned protobuf.
          pip install -r laya-rust/tools/requirements-regen.txt
      # Identical jobs have run in about 25 and about 47 minutes depending on the host, and the
      # logs carried no hardware information. Print it so a slow run can be attributed.
      - name: Runner hardware (diagnostic)
        run: |
          nproc
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Core'
      - name: Test regeneration cache and skip guard
        run: python laya-rust/tools/test_ci_tools.py

      # The exports are the slow part (download, trace, verify). They depend only on the pinned
      # Hugging Face revision (HF_REVISION in regen_golden.py), the two exporters, the pinned
      # toolchain and the model definition in laya/common.py, so that is the cache key; the
      # script re-checks the same inputs itself (a stamp) before it reuses a directory. The
      # goldens are never cached: they are recorded fresh in the `goldens` job and arrive as an
      # artifact.
      - name: Cache exported english artifacts
        if: ${{ contains(matrix.checkpoints, 'english') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            onnx/english
            onnx-split/english
          key: laya-rust-onnx-${{ runner.os }}-english-${{ hashFiles('laya-rust/tools/regen_golden.py', 'laya-dotnet/tools/export_onnx.py', 'laya-ts/scripts/export_onnx.py', 'laya-rust/tools/requirements-regen.txt', 'laya/common.py') }}
      - name: Cache exported multilingual artifacts
        if: ${{ contains(matrix.checkpoints, 'multilingual') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            onnx/multilingual
            onnx-split/multilingual
          key: laya-rust-onnx-${{ runner.os }}-multilingual-${{ hashFiles('laya-rust/tools/regen_golden.py', 'laya-dotnet/tools/export_onnx.py', 'laya-ts/scripts/export_onnx.py', 'laya-rust/tools/requirements-regen.txt', 'laya/common.py') }}
      - name: Cache exported typed-decisions artifacts
        if: ${{ contains(matrix.checkpoints, 'typed-decisions') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            onnx/typed-decisions
            onnx-split/typed-decisions
          key: laya-rust-onnx-${{ runner.os }}-typed-decisions-${{ hashFiles('laya-rust/tools/regen_golden.py', 'laya-dotnet/tools/export_onnx.py', 'laya-ts/scripts/export_onnx.py', 'laya-rust/tools/requirements-regen.txt', 'laya/common.py') }}

      - name: Take the recorded goldens
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-goldens
          path: laya-rust/tests/golden
      - name: The recorded goldens arrived
        run: |
          for c in routing ${{ matrix.checkpoints }}; do
            test -d "laya-rust/tests/golden/$c" \
              || { echo "::error::the goldens artifact is missing $c/"; exit 1; }
          done
      - name: Golden drift vs. committed (informational)
        run: |
          git --no-pager diff --stat -- laya-rust/tests/golden
          git status --short -- laya-rust/tests/golden
      - name: Install stable Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Cache Cargo dependencies and build output (not goldens)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            laya-rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('laya-rust/Cargo.lock') }}
      # The fused layout is found by walking up to <repo>/onnx and the split layout to
      # <repo>/onnx-split, which is where regen_golden.py wrote them. LAYA_TEST_CHECKPOINTS
      # limits the tests to this cell's checkpoints; a deselected checkpoint is skipped silently,
      # a selected one with missing artifacts or goldens prints `skip:`, which the guard rejects.
      # Debug profile on purpose. Measured on english with the same 371 tests passing in both: debug
      # 1318 s warm, release 1296 s including a cold compile (tests alone 1117 s vs 1304 s). The time is
      # ONNX Runtime native inference, which the profile does not change, so release buys about 2%.
      - name: Cargo tests (serial model loads)
        working-directory: laya-rust
        shell: bash
        env:
          LAYA_TEST_CHECKPOINTS: ${{ matrix.checkpoints }}
        run: |
          set -o pipefail
          cargo test ${{ matrix.test-args }} --locked -- --nocapture --test-threads=1 2>&1 | tee cargo-test.log
      # The floor is per cell, not one whole-lane number: a cell that loads no checkpoint would
      # otherwise pass by scoring nothing while the others make up the count.
      - name: No test was skipped
        if: ${{ success() }}
        run: python laya-rust/tools/check_test_skips.py laya-rust/cargo-test.log --min-passed ${{ matrix.min-passed }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: rust-parity-diagnostics-${{ matrix.name }}
          path: |
            laya-rust/cargo-test.log
            laya-rust/tests/golden
