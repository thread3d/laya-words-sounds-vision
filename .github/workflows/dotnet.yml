name: .NET

# Parity lane for laya-dotnet. The golden fixtures under laya-dotnet/tests/Laya.Tests/golden are
# recorded from the Python `laya` package, so this reports weekly over the whole tree (no path
# filter) and on demand: a change to laya/ that moves what the goldens capture turns up in the
# weekly drift report rather than as silent drift. One `goldens` job re-records them from the Python
# code at that commit (tools/regen_golden.py) and the cells run the C# tests against that recording.
#
# ADVISORY, not blocking. Both jobs carry `continue-on-error`, so this lane reports drift and
# attributes it to the pull request that caused it without failing that pull request. The reason
# is direction: the Python package is the product and laya-dotnet follows it, so a Python-side
# improvement must not be blocked on a C# port catching up. The optional-dependency CVE audit in
# security.yml is advisory for the same reason ("visible here, not blocking PRs"). When this lane
# goes red, the fix is a follow-up port, not a revert of the Python change.

on:
  # Weekly report, and on demand. Every job in this lane is advisory (`continue-on-error`), so
  # nothing it reports can block a pull request or a release. One `goldens` job records what every
  # cell compares against. See docs/ci.md.
  schedule:
    - cron: "0 4 * * 1"       # Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.event_name }}-${{ github.ref }}
  # Supersede, don't queue: a burst of pushes otherwise bills every commit's matrix (see ci.yml).
  # The old note here said pushes get a per-commit group so each one finishes; that is the behaviour
  # the private-repo minute allowance cannot pay for.
  cancel-in-progress: true

env:
  # transformers probes for TensorFlow at import; when TF is present its abseil runtime can
  # deadlock model construction. Laya is torch-only.
  USE_TF: "0"
  USE_TORCH: "1"
  TOKENIZERS_PARALLELISM: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  GOLDEN: laya-dotnet/tests/Laya.Tests/golden

jobs:
  # One job records the goldens every cell compares against. Before this, all eight job instances --
  # the model-free `build` plus seven parity cells -- installed torch, fetched the checkpoints from
  # the hub and ran `regen_golden.py`, and the cells that differ only in `layouts` recorded
  # byte-identical goldens from the same checkpoint: seven copies of four recordings. See
  # docs/ci.md ("Record once, fan out").
  goldens:
    name: goldens (recorded once for every cell)
    runs-on: ${{ fromJSON(vars.LAYA_RUNNER || '["ubuntu-latest"]') }}
    # 120, not 60, because this job now does serially what seven cells used to do in parallel: on a
    # cold export cache it pays for three checkpoints x two layouts itself. rust.yml measured the
    # same exporters at 23m58s for english and 8m50s for multilingual cold, so a first run after a
    # model-definition change can spend most of an hour here before the first golden is written.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: laya-dotnet/tools/requirements-regen.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.14.0" --index-url https://download.pytorch.org/whl/cpu
          pip install -r laya-dotnet/tools/requirements-regen.txt

      # The same keys the parity cells restore, so a cold cache is warmed HERE and every cell
      # restores it: the cells declare `needs: goldens`, and a cache entry is saved before the job
      # reports complete, so the entry exists by the time they start.
      - name: Cache exported english artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            onnx/english
            onnx-split/english
          key: laya-onnx-${{ runner.os }}-english-${{ hashFiles('laya-dotnet/tools/regen_golden.py', 'laya-dotnet/tools/export_onnx.py', 'laya-ts/scripts/export_onnx.py', 'laya-dotnet/tools/requirements-regen.txt', 'laya/common.py') }}
      - name: Cache exported multilingual artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            onnx/multilingual
            onnx-split/multilingual
          key: laya-onnx-${{ runner.os }}-multilingual-${{ hashFiles('laya-dotnet/tools/regen_golden.py', 'laya-dotnet/tools/export_onnx.py', 'laya-ts/scripts/export_onnx.py', 'laya-dotnet/tools/requirements-regen.txt', 'laya/common.py') }}
      - name: Cache exported typed-decisions artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            onnx/typed-decisions
            onnx-split/typed-decisions
          key: laya-onnx-${{ runner.os }}-typed-decisions-${{ hashFiles('laya-dotnet/tools/regen_golden.py', 'laya-dotnet/tools/export_onnx.py', 'laya-ts/scripts/export_onnx.py', 'laya-dotnet/tools/requirements-regen.txt', 'laya/common.py') }}
      - name: Cache pinned Hugging Face downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: laya-hf-${{ runner.os }}-goldens-${{ hashFiles('laya-dotnet/tools/regen_golden.py', 'laya-dotnet/tools/export_onnx.py', 'laya-ts/scripts/export_onnx.py') }}

      - name: Export the checkpoints and record every golden from Python
        env:
          # Scoped to this step, not the workflow: a workflow-level `env` reaches every step of
          # every job, including `pip`, `gradle`, `semgrep` and third-party actions that have no
          # business holding a credential. Only the steps that fetch from the hub get it.
          #
          # Unauthenticated requests are rate-limited, and a throttled fetch is what arrived
          # TRUNCATED here. Unset expands to "", which the implicit token path treats as
          # anonymous -- the explicit `token=` call sites normalise "" to None themselves,
          # because an empty Bearer header makes httpx refuse the request outright.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python laya-dotnet/tools/regen_golden.py --checkpoint all

      # The recorder's floor. A family that did not get written reaches a cell as a skip, and a skip
      # is not a failure to `dotnet test` -- so an empty directory here would read as a green parity
      # cell there.
      - name: The recorded set is complete
        run: |
          for c in routing round4 english multilingual typed-decisions; do
            test -d "$GOLDEN/$c" || { echo "::error::the recorder did not write $GOLDEN/$c"; exit 1; }
            test -n "$(find "$GOLDEN/$c" -type f -name '*.json' -print -quit)" \
              || { echo "::error::$GOLDEN/$c holds no JSON"; exit 1; }
          done

      # One day: an input to this run's cells, not an archive. Artifact storage is billed the way
      # minutes are.
      - name: Publish the goldens
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-goldens
          path: laya-dotnet/tests/Laya.Tests/golden
          retention-days: 1

  build:
    name: build + model-free tests
    runs-on: ${{ fromJSON(vars.LAYA_RUNNER || '["ubuntu-latest"]') }}
    # The routing goldens arrive recorded; this job runs the model-free tests and the regen-cache
    # regressions in tools/test_ci_tools.py, neither of which needs a checkpoint.
    needs: goldens
    continue-on-error: true   # advisory: see the header
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: laya-dotnet/tools/requirements-regen.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # No torch: nothing here records a golden any more, and the two tools this job runs
          # (test_ci_tools.py, check_test_skips.py) never import it. requirements-regen.txt is still
          # installed because those tools import the pinned protobuf.
          pip install -r laya-dotnet/tools/requirements-regen.txt
      - name: Test regeneration cache and skip guard
        run: python laya-dotnet/tools/test_ci_tools.py
      - name: Take the recorded goldens
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotnet-goldens
          path: laya-dotnet/tests/Laya.Tests/golden
      - name: Golden drift vs. committed (informational)
        run: |
          git --no-pager diff --stat -- "$GOLDEN"
          git status --short -- "$GOLDEN"
      # setup-dotnet downloads the SDK global.json resolves to from Microsoft's storage, which
      # intermittently answers HTTP 409 (2026-10-25: #1324 and main, several jobs in one hour). Retry
      # once after a pause, then fall back to the runner image's own .NET 10 SDK, which global.json
      # (10.0.100, rollForward latestFeature) accepts; fail with a clear message only if neither works.
      - id: setup_dotnet
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        continue-on-error: true
        with:
          global-json-file: laya-dotnet/global.json
      - name: Wait before retrying the .NET SDK download
        if: ${{ steps.setup_dotnet.outcome == 'failure' }}
        run: sleep 60
      - id: setup_dotnet_retry
        if: ${{ steps.setup_dotnet.outcome == 'failure' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        continue-on-error: true
        with:
          global-json-file: laya-dotnet/global.json
      - name: Fall back to the runner's .NET 10 SDK
        if: ${{ steps.setup_dotnet.outcome == 'failure' && steps.setup_dotnet_retry.outcome == 'failure' }}
        working-directory: laya-dotnet
        run: |
          echo "::warning::setup-dotnet could not download the SDK twice (Microsoft storage); trying the runner's own SDK"
          dotnet --list-sdks || true
          if ! dotnet --version; then
            echo "::error::No .NET 10 SDK: the download failed twice and the runner's SDK does not satisfy global.json. Re-run the job."
            exit 1
          fi
      - name: .NET SDK in use
        working-directory: laya-dotnet
        run: dotnet --version
      - name: Build (library, samples and tests, warnings are errors)
        working-directory: laya-dotnet
        run: dotnet build Laya.slnx -c Release
      - name: Tests that need no model
        working-directory: laya-dotnet
        run: >
          dotnet test --solution Laya.slnx -c Release --no-build
          --results-directory "$RUNNER_TEMP/trx" --report-xunit-trx --report-xunit-trx-filename build.trx
          --filter-not-class Laya.Tests.PredictParityTests
          --filter-not-class Laya.Tests.ShapeSweepTests
          --filter-not-class Laya.Tests.TokenizerParityTests
          --filter-not-class Laya.Tests.RouterEndToEndTests
          --filter-not-class Laya.Tests.ShortlistEndToEndTests
      # With the model-backed classes filtered out nothing may be skipped, so every checkpoint
      # is listed as expected to run.
      - name: No test was skipped
        if: ${{ !cancelled() }}
        run: >
          python laya-dotnet/tools/check_test_skips.py "$RUNNER_TEMP/trx/build.trx"
          --have english multilingual typed-decisions --min-passed 600
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: dotnet-build-diagnostics
          path: |
            ${{ runner.temp }}/trx
            ${{ env.GOLDEN }}/routing

  parity:
    name: parity (${{ matrix.name }})
    runs-on: ${{ fromJSON(vars.LAYA_RUNNER || '["ubuntu-latest"]') }}
    # The goldens arrive recorded (and byte-identical across the cells that share a checkpoint);
    # what stays per cell is the ONNX artifacts it needs and the C# tests in its own layout filter.
    needs: goldens
    continue-on-error: true   # advisory: see the header
    # Per cell, from the matrix (see the derivation below). The single-cell limit went from 60 to
    # 120 on main (b9fe351c) because the replays grew: on a478221b, where #1358 added about 50 batch
    # cases per checkpoint, english took 52m, typed-decisions was killed at 60m mid-test-run and
    # recorded as CANCELLED (which reads like a superseded run, not a budget failure), multilingual
    # 13m and router 26m. Splitting each checkpoint by layout halves the replays per cell, so each
    # cell gets a limit sized from its own measured time instead of one shared headroom number.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # FOUR at a time. This used to bound concurrent Hugging Face fetches -- seven cells each
      # fetching the same repo is what once provoked a throttle, and two was the answer then. The
      # fetching moved into the `goldens` job, so what this bounds now is CPU contention among C#
      # test runs on a shared runner. Four gives a critical path of about 60 minutes on the
      # slow-host estimates below; two would be about 105, which is no better than the
      # one-cell-per-checkpoint shape this matrix replaced. The cells are listed longest first so the
      # long ones start together and the short ones fill slots as they free up.
      max-parallel: 4
      # One cell per checkpoint x layout, so a red cell names the layout that drifted. The recording
      # is layout independent: both cells of a checkpoint test the same `goldens` artifact, which is
      # why they no longer regenerate it.
      #
      # `layouts` is LAYA_TEST_LAYOUTS: it narrows the theory rows that exist for both layouts
      # (long and batch predictions). The test methods that exercise one layout only carry
      # `[Trait("Layout", ...)]`: `split-only` for the split-layout theories, `any` for the
      # layout-parameterised ones. The fused cell therefore runs everything except `split-only`,
      # including the tokenizer, shortlist, error-case and multilingual-only tests, which do not
      # depend on the layout and so run once; the split cell runs `split-only` and `any`. A
      # deselected test is never discovered, so it cannot show up as a skip.
      #
      # `min-passed` and `timeout`, from the committed goldens and the lane logs in
      # researcher-agent/ci-runtime.md (slow-host mode, 4 vCPU, the worse of the two modes seen):
      #  * Tests per cell, counted from the theory data with LAYA_TEST_CHECKPOINTS and
      #    LAYA_TEST_LAYOUTS set (all layouts together the english count is 484, the same as the
      #    a478221b log):
      #      english          fused 222 pass (216 rows + 6 layout independent), split 130
      #      multilingual     fused 323 pass, split 136
      #      typed-decisions  fused 228 pass, split 136
      #    `min-passed` is about 80% of that, rounded down: a floor against a wrong filter or a
      #    dropped group, with room for the case count to shrink. A layout whose artifacts are
      #    missing is caught by the skip guard, not by this floor.
      #  * Time. Tests measured on a slow host with both layouts in one cell: english 33.8 min,
      #    typed-decisions about 41 (its cell hit the old 60 minute cap), multilingual 8-16; regen
      #    17.1 / 19.4 / 4.5 min; the router cell 15-22 in total. A layout cell does about half of
      #    the forward passes (each success case runs once per layout); take 0.55 for the fused
      #    cell, which also carries the one-off tests. Volume is expected to grow by about 47% when
      #    the pending option-order and lang-temperature cases land. Projected cell: install + regen
      #    + 0.55 x tests x 1.47 + 1 => english about 46, typed-decisions about 54, multilingual
      #    about 17, router 22. `timeout` is that with 1.5x to 2x headroom for a slower host or a
      #    cold export cache (about 3 minutes per checkpoint): 75 / 90 / 40 / 45.
      matrix:
        include:
          - name: typed-decisions-fused
            cache: typed-decisions
            checkpoints: typed-decisions
            layouts: fused
            filter: --filter-class Laya.Tests.PredictParityTests Laya.Tests.TokenizerParityTests Laya.Tests.ShapeSweepTests Laya.Tests.ShortlistEndToEndTests --filter-not-trait Layout=split-only
            min-passed: 180
            timeout: 90
          - name: typed-decisions-split
            cache: typed-decisions
            checkpoints: typed-decisions
            layouts: split
            filter: --filter-class Laya.Tests.PredictParityTests Laya.Tests.TokenizerParityTests Laya.Tests.ShapeSweepTests Laya.Tests.ShortlistEndToEndTests --filter-trait Layout=split-only --filter-trait Layout=any
            min-passed: 105
            timeout: 90
          - name: english-fused
            cache: english
            checkpoints: english
            layouts: fused
            filter: --filter-class Laya.Tests.PredictParityTests Laya.Tests.TokenizerParityTests Laya.Tests.ShapeSweepTests Laya.Tests.ShortlistEndToEndTests --filter-not-trait Layout=split-only
            min-passed: 175
            timeout: 75
          - name: english-split
            cache: english
            checkpoints: english
            layouts: split
            filter: --filter-class Laya.Tests.PredictParityTests Laya.Tests.TokenizerParityTests Laya.Tests.ShapeSweepTests Laya.Tests.ShortlistEndToEndTests --filter-trait Layout=split-only --filter-trait Layout=any
            min-passed: 100
            timeout: 75
          # The router end-to-end tests load english and multilingual side by side; they have
          # no layout parameter, so LAYA_TEST_LAYOUTS stays unset.
          - name: router
            cache: router
            checkpoints: english multilingual
            layouts: ""
            filter: --filter-class Laya.Tests.RouterEndToEndTests
            min-passed: 1
            timeout: 45
          - name: multilingual-fused
            cache: multilingual
            checkpoints: multilingual
            layouts: fused
            filter: --filter-class Laya.Tests.PredictParityTests Laya.Tests.TokenizerParityTests Laya.Tests.ShapeSweepTests Laya.Tests.ShortlistEndToEndTests --filter-not-trait Layout=split-only
            min-passed: 255
            timeout: 40
          - name: multilingual-split
            cache: multilingual
            checkpoints: multilingual
            layouts: split
            filter: --filter-class Laya.Tests.PredictParityTests Laya.Tests.TokenizerParityTests Laya.Tests.ShapeSweepTests Laya.Tests.ShortlistEndToEndTests --filter-trait Layout=split-only --filter-trait Layout=any
            min-passed: 105
            timeout: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # So the runner's speed can be read from the log: the same job has run at twice the
      # per-token cost on some hosts, and the CPU model and core count are what tell them apart.
      - name: Runner CPU
        run: |
          nproc
          lscpu | grep -E '^(Model name|CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket|Socket\(s\)|CPU max MHz)'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: laya-dotnet/tools/requirements-regen.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # No torch and no hub token: this cell records nothing. requirements-regen.txt is still
          # installed because `check_test_skips.py` imports the pinned protobuf.
          pip install -r laya-dotnet/tools/requirements-regen.txt

      # The exports are the slow part (download, trace, verify). They depend only on the pinned
      # Hugging Face revision (HF_REVISION in regen_golden.py), the two exporters, the pinned
      # toolchain and the model definition in laya/common.py, so that is the cache key; the
      # script re-checks the same inputs itself before it reuses a directory. The goldens are
      # never cached: they are recorded fresh in the `goldens` job and arrive as an artifact.
      - name: Cache exported english artifacts
        if: ${{ contains(matrix.checkpoints, 'english') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            onnx/english
            onnx-split/english
          key: laya-onnx-${{ runner.os }}-english-${{ hashFiles('laya-dotnet/tools/regen_golden.py', 'laya-dotnet/tools/export_onnx.py', 'laya-ts/scripts/export_onnx.py', 'laya-dotnet/tools/requirements-regen.txt', 'laya/common.py') }}
      - name: Cache exported multilingual artifacts
        if: ${{ contains(matrix.checkpoints, 'multilingual') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            onnx/multilingual
            onnx-split/multilingual
          key: laya-onnx-${{ runner.os }}-multilingual-${{ hashFiles('laya-dotnet/tools/regen_golden.py', 'laya-dotnet/tools/export_onnx.py', 'laya-ts/scripts/export_onnx.py', 'laya-dotnet/tools/requirements-regen.txt', 'laya/common.py') }}
      - name: Cache exported typed-decisions artifacts
        if: ${{ contains(matrix.checkpoints, 'typed-decisions') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            onnx/typed-decisions
            onnx-split/typed-decisions
          key: laya-onnx-${{ runner.os }}-typed-decisions-${{ hashFiles('laya-dotnet/tools/regen_golden.py', 'laya-dotnet/tools/export_onnx.py', 'laya-ts/scripts/export_onnx.py', 'laya-dotnet/tools/requirements-regen.txt', 'laya/common.py') }}

      - name: Take the recorded goldens
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotnet-goldens
          path: laya-dotnet/tests/Laya.Tests/golden
      - name: The recorded goldens arrived
        run: |
          for c in routing round4 english multilingual typed-decisions; do
            test -d "$GOLDEN/$c" || { echo "::error::the goldens artifact is missing $c/"; exit 1; }
          done
      # Informational only: float noise across platforms is expected, the C# tests and their
      # tolerances are the gate.
      - name: Golden drift vs. committed (informational)
        run: |
          git --no-pager diff --stat -- "$GOLDEN"
          git status --short -- "$GOLDEN"

      # setup-dotnet downloads the SDK global.json resolves to from Microsoft's storage, which
      # intermittently answers HTTP 409 (2026-10-25: #1324 and main, several jobs in one hour). Retry
      # once after a pause, then fall back to the runner image's own .NET 10 SDK, which global.json
      # (10.0.100, rollForward latestFeature) accepts; fail with a clear message only if neither works.
      - id: setup_dotnet
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        continue-on-error: true
        with:
          global-json-file: laya-dotnet/global.json
      - name: Wait before retrying the .NET SDK download
        if: ${{ steps.setup_dotnet.outcome == 'failure' }}
        run: sleep 60
      - id: setup_dotnet_retry
        if: ${{ steps.setup_dotnet.outcome == 'failure' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        continue-on-error: true
        with:
          global-json-file: laya-dotnet/global.json
      - name: Fall back to the runner's .NET 10 SDK
        if: ${{ steps.setup_dotnet.outcome == 'failure' && steps.setup_dotnet_retry.outcome == 'failure' }}
        working-directory: laya-dotnet
        run: |
          echo "::warning::setup-dotnet could not download the SDK twice (Microsoft storage); trying the runner's own SDK"
          dotnet --list-sdks || true
          if ! dotnet --version; then
            echo "::error::No .NET 10 SDK: the download failed twice and the runner's SDK does not satisfy global.json. Re-run the job."
            exit 1
          fi
      - name: .NET SDK in use
        working-directory: laya-dotnet
        run: dotnet --version
      # The fused layout is found through LAYA_ONNX_ROOT; the split layout through the test
      # project's walk-up to <repo>/onnx-split, which is where the script wrote it.
      - name: Run the tests against the fresh goldens
        working-directory: laya-dotnet
        env:
          LAYA_ONNX_ROOT: ${{ github.workspace }}/onnx
          LAYA_TEST_CHECKPOINTS: ${{ matrix.checkpoints }}
          LAYA_TEST_LAYOUTS: ${{ matrix.layouts }}
        run: >
          dotnet test --solution Laya.slnx -c Release
          --results-directory "$RUNNER_TEMP/trx" --report-xunit-trx --report-xunit-trx-filename parity.trx
          ${{ matrix.filter }}
      # Missing artifacts make the model-backed tests skip, and a skip is not a failure to
      # `dotnet test`. Fail the run unless every skip is for a checkpoint this job does not own.
      - name: No model-backed test was skipped
        if: ${{ !cancelled() }}
        run: >
          python laya-dotnet/tools/check_test_skips.py "$RUNNER_TEMP/trx/parity.trx"
